name: reviewdog

on:
  pull_request:
    paths-ignore:
      - '**.md'
jobs:
  linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: reviewdog/action-setup@v1
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle
      - name: Run reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN}}
        # detekt 2 ignores build.maxIssues, so the build is allowed to fail on findings; a missing report still
        # fails the step, so a broken compilation is not mistaken for a clean run
        run: |
          ./gradlew detektMain detektTest --continue || true
          reviewdog -f=checkstyle -name="detekt-main" -reporter="github-pr-check" -level="error" < build/reports/detekt/main.xml
          reviewdog -f=checkstyle -name="detekt-test" -reporter="github-pr-check" -level="error" < build/reports/detekt/test.xml
